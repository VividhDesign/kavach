# Kavach runtime configuration. Times are in seconds of video time.
models:
  pose: weights/yolo11s-pose.pt     # COCO pose: strong person detector + 17 keypoints
  ppe: weights/ppe_y11s_sh17.pt     # fine-tuned on SH17; PPE checks are skipped if this file is missing
  tracker: bytetrack.yaml
  imgsz: 640
  person_conf: 0.35
  ppe_conf: 0.35

ppe:
  min_ioa: 0.30           # helmet box must overlap the head region by this fraction of the helmet's area
  min_person_h: 60        # px; smaller people are UNKNOWN, never a violation
  window_frames: 15
  violation_ratio: 0.7
  min_known: 8

mandown:
  lying_angle_deg: 60
  upright_angle_deg: 35
  lying_aspect: 1.3
  confirm_s: 0.5
  fall_window_s: 2.0
  man_down_s: 4.0
  still_motion: 0.3       # body diagonals per second; above this the person is moving, not man-down
  recover_s: 1.0

events:
  cooldown_s: 10
track_ttl_s: 3
