[project]
name = "kavach"
version = "0.1.0"
description = "Vision-based worker safety monitoring: tracking, danger zones, man-down and PPE detection with OpenCV + YOLO"
authors = [
    { name = "Vividh Yadav", email = "vividh50@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lap>=0.5.13",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.190",
]



[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
